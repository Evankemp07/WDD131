<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RecipeBook</title>
  <meta name="description" content="Find delicious recipes like warm apple crisp served with vanilla ice cream.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="RecipeBook">
  <meta property="og:description" content="Find delicious recipes like warm apple crisp served with vanilla ice cream.">
  <meta property="og:url" content="https://evankemp07.github.io/WDD131/prove/recipes">
  <meta property="og:image" content="./images/apple-crisp.jpg">

  <!-- X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RecipeBook">
  <meta name="twitter:description" content="Find delicious recipes like warm apple crisp served with vanilla ice cream.">
  <meta name="twitter:image" content="./images/apple-crisp.jpg">

  <link rel="icon" href="../../favicon.ico">
  <link rel="apple-touch-icon" href="../../images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script defer src="recipes.js"></script>
</head>

<body>
  <main>
    <header>
      <img src="./images/recipe-book.png" alt="RecipeBook logo">
      <h1>RecipeBook</h1>
    </header>

    <form class="search">
      <label for="recipe-search" class="visually-hidden">Find a recipe</label>
      <input id="recipe-search" type="search" placeholder="Find a recipe">
      <button type="submit">
        <img src="./images/search.svg" alt="Search">
      </button>
    </form>

    <div id="recipe-container"></div>
  </main>

  <footer>
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">
      Recipe icons created by Freepik - Flaticon
    </a>

    <div class="social">
      <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
      <a href="#"><img src="./images/instagram_icon.svg" alt="instagram icon"></a>
      <a href="#"><img src="./images/youtube_icon.svg" alt="youtube icon"></a>
      <a href="#"><img src="./images/pinterest_icon.svg" alt="pinterest icon"></a>
    </div>
  </footer>
</body>
</html>
