<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Find hiking trails that match your difficulty, distance, and trail type preferences with TrailScout Hike Finder.">
  <title>TrailScout Hike Finder</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/roboto-slab-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lato-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/styles.css">
  <link
    rel="preload"
    as="image"
    type="image/webp"
    imagesrcset="images/hero-480w.webp 480w, images/hero-640w.webp 640w, images/hero-768w.webp 768w, images/hero-960w.webp 960w"
    imagesizes="(min-width: 768px) min(576px, 50vw), 100vw"
    fetchpriority="high"
  >
  <script src="scripts/script.js" defer></script>
  <script src="scripts/hikes-data.js" defer></script>
  <script src="scripts/hike-filters.js" defer></script>
  <script src="scripts/storage.js" defer></script>
  <script src="scripts/hikes.js" defer></script>
</head>

<body>
  <div class="page-wrapper home-page">
    <header class="site-header home-header">
      <div class="brand">
        <a href="index.html" class="brand-link">
          <img src="images/logo.svg" alt="TrailScout Hike Finder logo" class="logo-image" width="64" height="64">
          <span class="brand-name">TrailScout Hike Finder</span>
        </a>
      </div>

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-expanded="false"
        aria-controls="mainNavigation"
      >
        Menu
      </button>

      <nav class="main-navigation" id="mainNavigation" aria-label="Main navigation">
        <a href="index.html" class="active" aria-current="page">Home</a>
        <a href="favorites.html">Favorited Hikes</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <section class="home-hero">
      <div class="home-hero-content">
        <h2>Find Your Perfect Hike</h2>
        <p>
          Filter trails by difficulty, distance, and type to match your
          preferences and skill level.
        </p>
      </div>

      <picture>
        <source
          type="image/webp"
          srcset="images/hero-480w.webp 480w, images/hero-640w.webp 640w, images/hero-768w.webp 768w, images/hero-960w.webp 960w"
          sizes="(min-width: 768px) min(576px, 50vw), 100vw"
        >
        <source
          type="image/jpeg"
          srcset="images/hero-480w.jpg 480w, images/hero-640w.jpg 640w, images/hero-768w.jpg 768w, images/hero-960w.jpg 960w"
          sizes="(min-width: 768px) min(576px, 50vw), 100vw"
        >
        <img
          class="home-hero-image"
          src="images/hero-640w.webp"
          alt="A hiker crossing a rocky alpine ridge below towering mountain cliffs"
          width="1200"
          height="700"
          fetchpriority="high"
        >
      </picture>
    </section>

    <main class="home-main">
      <aside class="filters-panel" aria-label="Trail filters">
        <h3>Filters</h3>

        <form class="filters-form" id="filterForm">
          <div class="filter-group">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty" name="difficulty">
              <option value="">Any Difficulty</option>
              <option value="Easy">Easy</option>
              <option value="Moderate">Moderate</option>
              <option value="Hard">Hard</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="distance">Max Distance</label>
            <select id="distance" name="distance">
              <option value="">Any Distance</option>
              <option value="2">Under 2 miles</option>
              <option value="5">Under 5 miles</option>
              <option value="10">Under 10 miles</option>
              <option value="10+">10+ miles</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="trailType">Trail Type</label>
            <select id="trailType" name="trailType">
              <option value="">Any Type</option>
              <option value="Loop">Loop</option>
              <option value="Out & Back">Out &amp; Back</option>
              <option value="Point to Point">Point to Point</option>
            </select>
          </div>

          <div class="filter-actions">
            <button class="reset-button" type="reset">Reset</button>
          </div>
        </form>
      </aside>

      <section class="results-panel" id="available-hikes" aria-labelledby="resultsHeading">
        <div class="results-header">
          <h3 id="resultsHeading">Available Hikes</h3>
          <div class="results-controls">
            <label class="sort-label" for="sortBy">Sort by</label>
            <select id="sortBy" name="sortBy" aria-label="Sort hikes">
              <option value="name-asc">Name (A-Z)</option>
              <option value="name-desc">Name (Z-A)</option>
              <option value="distance-asc">Distance (Shortest)</option>
              <option value="distance-desc">Distance (Longest)</option>
              <option value="difficulty-asc">Difficulty (Easiest)</option>
              <option value="difficulty-desc">Difficulty (Hardest)</option>
            </select>
            <span class="results-count" id="resultsCount">4 Results</span>
          </div>
        </div>

        <div class="results-search">
          <label class="search-label" for="hikeSearch">Search</label>
          <input
            class="hike-search-input"
            type="search"
            id="hikeSearch"
            name="hikeSearch"
            placeholder="Search by name, location, or description..."
            autocomplete="off"
          >
        </div>

        <div class="hike-grid" id="hikeGrid"></div>
      </section>
    </main>

    <footer class="site-footer home-footer">
      <img src="images/logo.svg" alt="" class="footer-logo-image" width="40" height="40" aria-hidden="true">
      <p>TrailScout Hike Finder</p>
      <nav class="footer-links" aria-label="Footer links">
        <a href="about.html">About</a>
        <a href="favorites.html">Favorited Hikes</a>
      </nav>
      <p>&copy; <span id="currentYear"></span> TrailScout. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
